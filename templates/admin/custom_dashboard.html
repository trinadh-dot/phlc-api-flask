{% extends 'admin/master.html' %}

{% block head_css %}
{{ super() }}
<style>
  :root {
    --primary: #4f46e5;
    --sidebar-bg: #1e293b;
    --sidebar-hover: #334155;
  }

  body {
    background: var(--bg-body) !important;
  }

  /* Main Content */
  .main-content {
    margin-left: 260px;
    padding: 40px;
    max-width: 1400px;
  }

  .dashboard-header {
    background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
    border-radius: 20px;
    padding: 32px;
    margin-bottom: 32px;
    box-shadow: var(--shadow-sm);
    border: 1px solid rgba(0, 0, 0, 0.05);
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: white;
  }

  .header-content h1 {
    font-size: 1.8rem;
    font-weight: 700;
    color: white;
    margin: 0 0 8px 0;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .header-content p {
    color: rgba(255, 255, 255, 0.9);
    margin: 0;
    font-size: 1rem;
  }

  .header-stats {
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(8px);
    padding: 12px 24px;
    border-radius: 12px;
    text-align: center;
    border: 1px solid rgba(255, 255, 255, 0.2);
  }

  .stat-value {
    font-size: 1.5rem;
    font-weight: 700;
    color: white;
    line-height: 1;
  }

  .stat-label {
    font-size: 0.8rem;
    color: rgba(255, 255, 255, 0.8);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 4px;
  }

  .dashboard-grid {
    background: white;
    border-radius: 20px;
    padding: 32px;
    box-shadow: var(--shadow-sm);
    border: 1px solid rgba(0, 0, 0, 0.05);
  }

  .grid-controls {
    margin-bottom: 24px;
    position: relative;
  }

  .search-input-wrapper {
    position: relative;
    max-width: 400px;
  }

  .search-input-wrapper i {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
  }

  .search-input {
    width: 100%;
    padding: 14px 14px 14px 44px;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    font-size: 0.95rem;
    transition: var(--transition);
    background: var(--bg-body);
  }

  .search-input:focus {
    outline: none;
    border-color: var(--primary-light);
    background: white;
    box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
  }

  .tables-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }

  .table-card {
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    padding: 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    text-decoration: none;
    color: var(--text-main);
    transition: var(--transition);
    position: relative;
  }

  .table-card:hover {
    transform: translateY(-4px);
    border-color: var(--primary-light);
    box-shadow: var(--shadow-md);
    text-decoration: none;
    color: var(--text-main);
  }

  .table-icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: #eef2ff;
    color: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.25rem;
    transition: var(--transition);
  }

  .table-card:hover .table-icon {
    background: var(--primary);
    color: white;
  }

  .table-info {
    flex: 1;
    overflow: hidden;
  }

  .table-name {
    font-weight: 600;
    font-size: 1.3rem;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .table-meta {
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  .status-indicator {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #e2e8f0;
  }

  .table-card:hover .status-indicator {
    background: var(--success);
    box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
  }
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
{% endblock %}

{% block body %}
<!-- Custom Sidebar (from master) is already included -->

<!-- Main Content -->
<div class="main-content">
  <div class="dashboard-header">
    <div class="header-content">
      <h1><i class="fas fa-layer-group" style="color: white;"></i> Database Dashboard</h1>
      <p>Manage and monitor your database tables</p>
    </div>
    <div class="header-stats">
      <div class="stat-value">{{ table_views|length }}</div>
      <div class="stat-label">Total Tables</div>
    </div>
  </div>

  <div class="dashboard-grid">
    <div class="grid-controls">
      <div class="search-input-wrapper">
        <i class="fas fa-search"></i>
        <input type="text" class="search-input" placeholder="Search tables..." id="tableSearch"
          onkeyup="filterTables()">
      </div>
    </div>

    <div class="tables-grid" id="tableList">
      {% for table in table_views %}
      <a href="{{ table.url }}" class="table-card" data-name="{{ table.name|lower }}">
        <div class="table-icon">
          <i class="fas fa-table"></i>
        </div>
        <div class="table-info">
          <div class="table-name">{{ table.name }}</div>
          <div class="table-meta">Public Schema</div>
        </div>
        <div class="status-indicator"></div>
      </a>
      {% endfor %}
    </div>
  </div>
</div>

<script>
  function filterTables() {
    const input = document.getElementById('tableSearch');
    const filter = input.value.toLowerCase();
    const items = document.querySelectorAll('.table-card');

    items.forEach(item => {
      const name = item.getAttribute('data-name');
      if (name.indexOf(filter) > -1) {
        item.style.display = 'flex';
      } else {
        item.style.display = 'none';
      }
    });
  }
</script>
{% endblock %}
